name: test

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax and smoke tests
        run: sh tests/test_main.sh
      - name: ShellCheck
        run: shellcheck -S warning main.sh tests/test_main.sh
